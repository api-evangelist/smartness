name: Smartness
description: 'Smartness (formerly Smartpricing) is an Italian hospitality-technology company that helps hotels,
  B&Bs, and vacation-rental operators automate online operations and grow direct revenue. Its product suite spans
  AI dynamic pricing (Smartpricing), a property management system (Smartpms), 24/7 guest messaging (Smartchat),
  email marketing and segmentation (Smartconnect), a website builder (Smartsite), reputation, ads, and payments
  (Smartpay), serving 4,000+ accommodation providers across Europe. Smartness connects to 80+ PMS and
  channel-manager platforms through partner integrations, but publishes no public developer API or portal;
  integrations are arranged via a partnership request. Backed by Partech.'
